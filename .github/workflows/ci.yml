name: ci
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/lint
        uses: mattermost/actions/plugin-ci/lint@0256d363493a1e6b9e361ea788c62a0a73bc00be

  test:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The store and service tests require a real Postgres (PG14+ for the
    # hierarchy CYCLE clause) and never skip; the default test DSN is
    # postgres://mmuser:mostest@localhost:5432/mattermost_test.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: mattermost_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      # test-ci rather than the shared plugin-ci/test action (which runs plain `make
      # test`): it is the target that emits JUnit for the Go suite, without which there
      # is no machine-readable unit test result to publish. Run as two steps so a failing
      # server suite still lets the webapp suite write its own report — a single `make
      # test-ci` would stop at the first failure and publish half the results.
      - name: ci/test-server
        run: make test-ci-server

      - name: ci/test-webapp
        if: always()
        run: make test-ci-webapp

      - name: ci/upload-unit-test-results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-results
          path: |
            report.xml
            webapp/junit.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/build
        uses: mattermost/actions/plugin-ci/build@0256d363493a1e6b9e361ea788c62a0a73bc00be

  e2e-playwright-tests:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    needs: [build]
    # Generous because the suite's own budget is already large: a 20-minute
    # globalTimeout plus container startup and 2 retries, after npm ci, a browser
    # install and two image pulls.
    timeout-minutes: 45
    permissions:
      contents: read
    # No `services:` block on purpose: the suite provisions its own Mattermost and
    # Postgres via testcontainers, so CI and local runs take the identical path.
    steps:
      # Shallow: this job installs the e2e project and downloads the prebuilt bundle,
      # so it never reads git history.
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/playwright-e2e-test
        uses: ./.github/actions/playwright-e2e-test

  delivery:
    if: ${{ github.repository_owner == 'mattermost' && github.event_name != 'schedule' && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-ci.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/ci/ --acl public-read --cache-control no-cache
        working-directory: dist

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'mattermost' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-${REF_NAME}.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/release/ --acl public-read --cache-control no-cache
        working-directory: dist
