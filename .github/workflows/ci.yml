name: ci
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    tags:
      - "v*"
  # `edited` makes changing a PR's optional e2e-core-commit marker start a run immediately.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Superseded pull request runs are cancelled. Every other run gets a group of its own,
# because a shared group keeps only the newest pending run: a second push to master
# would cancel the first one's queued run, and with it the artifact delivery uploads.
# `queue: max` would hold them all instead, but it cannot be combined with the
# cancellation above and does not accept an expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/lint
        uses: mattermost/actions/plugin-ci/lint@0256d363493a1e6b9e361ea788c62a0a73bc00be

  test:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The store and service tests require a real Postgres (PG14+ for the
    # hierarchy CYCLE clause) and never skip; the default test DSN is
    # postgres://mmuser:mostest@localhost:5432/mattermost_test.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: mattermost_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      # test-ci, not the shared plugin-ci/test action: only it emits JUnit for Go. Two
      # steps so a failing server suite still lets the webapp write its report.
      - name: ci/test-server
        run: make test-ci-server

      - name: ci/test-webapp
        if: always()
        run: make test-ci-webapp

      - name: ci/upload-unit-test-results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-results
          path: |
            report.xml
            webapp/junit.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/build
        uses: mattermost/actions/plugin-ci/build@0256d363493a1e6b9e361ea788c62a0a73bc00be

  e2e-playwright-tests:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    needs: [build]
    # The suite's own budget is already 20 minutes plus startup, retries and pulls.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Lifted to env because the secrets context is not available in a step-level `if`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # No `services:` block: testcontainers provisions the server, so CI and local runs
    # take the same path.
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A PR may opt both E2E jobs into its own unmerged core build. Without the marker — including
      # every push to master and every later PR — the action selects the normal master image.
      - name: ci/resolve-e2e-core-image
        uses: ./.github/actions/resolve-e2e-core-image
        with:
          pull-request-body: ${{ github.event.pull_request.body || '' }}

      # Authenticated so the core image pull is billed to the org's Docker Hub quota rather than
      # the shared anonymous per-IP limit, which GitHub-hosted runners exhaust as a pull failure
      # that reads like a test failure. Skipped when no credentials exist — a fork PR has none, and
      # must still be able to pull anonymously.
      - name: ci/docker-login
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ci/playwright-e2e-test
        uses: ./.github/actions/playwright-e2e-test


  # The space-permission specs, which the job above deliberately does not collect: they need the
  # Enterprise license secret, which fork runs cannot see. Kept as its own job so the authoring
  # suite above keeps running on every PR, license or not.
  e2e-playwright-space-permissions:
    if: ${{ (github.repository_owner == 'mattermost' || github.event_name != 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Selects both the specs and the licensed container setup they need; see tests/helpers/mode.ts.
      MM_E2E_SPACE_PERMISSIONS: "true"
      # Lifted to env because the secrets context is not available in a step-level `if`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Resolve independently because jobs do not share environment, but from the same PR marker
      # as authoring so the two suites can never drift to different core commits.
      - name: ci/resolve-e2e-core-image
        uses: ./.github/actions/resolve-e2e-core-image
        with:
          pull-request-body: ${{ github.event.pull_request.body || '' }}

      # Fails here, by name, rather than inside a spec: the suite's own error would otherwise arrive
      # only after a container boot and a browser install.
      - name: ci/verify-license-available
        run: |
          if [[ -z "$MM_LICENSE" ]]; then
            echo "MM_E2E_TEST_LICENSE_ONPREM_ENT is not available to this repository." >&2
            echo "The space-permission specs demote a user to a guest, which requires" >&2
            echo "GuestAccountsSettings.Enable — a licensed feature; grant the org secret to this repo." >&2
            exit 1
          fi
        env:
          MM_LICENSE: ${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}

      # See the `e2e` job: authenticated so the core image pull is billed to the org's Docker Hub
      # quota rather than the shared anonymous per-IP limit, and skipped when no credentials exist.
      - name: ci/docker-login
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: ci/playwright-e2e-test
        uses: ./.github/actions/playwright-e2e-test
        with:
          # Distinct from the authoring job's, which uploads under the same names.
          ARTIFACT_SUFFIX: "-space-permissions"
          MM_LICENSE: ${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}

  delivery:
    if: ${{ github.repository_owner == 'mattermost' && github.event_name != 'schedule' && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-ci.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/ci/ --acl public-read --cache-control no-cache
        working-directory: dist

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'mattermost' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-${REF_NAME}.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/release/ --acl public-read --cache-control no-cache
        working-directory: dist
