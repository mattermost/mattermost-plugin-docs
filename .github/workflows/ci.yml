name: ci
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

# Superseded pull request runs are cancelled. Every other run gets a group of its own,
# because a shared group keeps only the newest pending run: a second push to master
# would cancel the first one's queued run, and with it the artifact delivery uploads.
# `queue: max` would hold them all instead, but it cannot be combined with the
# cancellation above and does not accept an expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/lint
        uses: mattermost/actions/plugin-ci/lint@0256d363493a1e6b9e361ea788c62a0a73bc00be

  test:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The store and service tests require a real Postgres (PG14+ for the
    # hierarchy CYCLE clause) and never skip; the default test DSN is
    # postgres://mmuser:mostest@localhost:5432/mattermost_test.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: mattermost_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      # test-ci, not the shared plugin-ci/test action: only it emits JUnit for Go. Two
      # steps so a failing server suite still lets the webapp write its report.
      - name: ci/test-server
        run: make test-ci-server

      - name: ci/test-webapp
        if: always()
        run: make test-ci-webapp

      - name: ci/upload-unit-test-results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-test-results
          path: |
            report.xml
            webapp/junit.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/build
        uses: mattermost/actions/plugin-ci/build@0256d363493a1e6b9e361ea788c62a0a73bc00be

  e2e-playwright-tests:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    needs: [build]
    # The suite's own budget is already 20 minutes plus startup, retries and pulls.
    timeout-minutes: 45
    permissions:
      contents: read
    # Declared here so the server under test shows up in a workflow diff; `vars` lets it
    # be changed from repository settings.
    env:
      MM_IMAGE: ${{ vars.MM_IMAGE || 'mattermostdevelopment/mattermost-enterprise-edition:master' }}
    # No `services:` block: testcontainers provisions the server, so CI and local runs
    # take the same path.
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ci/playwright-e2e-test
        uses: ./.github/actions/playwright-e2e-test

  # Publishes the PR bundle to the S3 path matterwick HEAD-polls when the
  # "Setup Cloud Test Server" label is applied:
  # <bucket>/mattermost-plugin-docs/mattermost-plugin-docs-<sha7>.tar.gz
  dist:
    if: ${{ github.repository_owner == 'mattermost' && github.event_name == 'pull_request' }}
    # The called workflow requests id-token: write, which the workflow-level default of
    # contents: read does not cover — without this the run fails to start at all.
    permissions:
      contents: read
      id-token: write
    uses: mattermost/actions-workflows/.github/workflows/plugin-dist-pr.yml@main
    secrets: inherit
    with:
      dist-target: "dist-linux"
      # The build job already gates on a full multi-platform `make dist`.
      verify-target: "manifest-check"
      s3-prefix: "mattermost-plugin-docs"

  delivery:
    if: ${{ github.repository_owner == 'mattermost' && github.event_name != 'schedule' && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-ci.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/ci/ --acl public-read --cache-control no-cache
        working-directory: dist

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'mattermost' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-${REF_NAME}.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/release/ --acl public-read --cache-control no-cache
        working-directory: dist
