name: ci
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/lint
        uses: mattermost/actions/plugin-ci/lint@0256d363493a1e6b9e361ea788c62a0a73bc00be

      # The browser suite is its own npm package with its own toolchain, so it type-checks through
      # its own `check` script rather than the plugin's check-style — the arrangement core and the
      # other plugin repos use. It runs here rather than in the e2e job because it needs no server,
      # no Docker and no core image, and that job is gated on CORE_IMAGE being configured.
      - name: ci/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: ci/e2e-check
        working-directory: e2e
        run: |
          npm ci
          npm run check

  test:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The store and service tests require a real Postgres (PG14+ for the
    # hierarchy CYCLE clause) and never skip; the default test DSN is
    # postgres://mmuser:mostest@localhost:5432/mattermost_test.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mmuser
          POSTGRES_PASSWORD: mostest
          POSTGRES_DB: mattermost_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/test
        uses: mattermost/actions/plugin-ci/test@0256d363493a1e6b9e361ea788c62a0a73bc00be

  build:
    if: ${{ github.repository_owner == 'mattermost' || github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      - name: ci/build
        uses: mattermost/actions/plugin-ci/build@0256d363493a1e6b9e361ea788c62a0a73bc00be

  # End-to-end suite: boots a real Mattermost via Testcontainers, installs this plugin, and drives
  # the space-permission scenarios through the real API with nothing mocked.
  #
  # It needs a server image carrying the paired core branch's space-permission changes. Core CI
  # publishes one per commit as mattermostdevelopment/mattermost-team-edition:<7-char-sha>, so set
  # the CORE_IMAGE repository variable to that tag. That stays the shape even after the core
  # changes ship in a release: the pin below compares against build/core-commit.txt, which only
  # ever names a commit sha, so CORE_IMAGE is always a per-commit sha tag.
  # While CORE_IMAGE is unset this job does not run: no available image could satisfy it, and a
  # silent pass would be worse than an absent one.
  #
  # DO NOT add this job to the repository's required status checks until CORE_IMAGE is set and the
  # suite is observed passing. A job skipped by a top-level `if:` reports as "skipped", and branch
  # protection counts a skipped required check as satisfied — so listing it early would admit every
  # PR as though the suite had run, which is the outcome the condition above exists to avoid.
  # For the same reason it is not in delivery/release `needs:` yet: a skipped dependency skips the
  # dependent job. Add it to both once CORE_IMAGE is populated, so a permission regression blocks
  # publishing.
  #
  # Fork PRs are excluded: repository variables (CORE_IMAGE) are visible to fork runs, but secrets
  # (the Enterprise test license below) are not, so the licensed scenarios would fail on every
  # fork PR. When this job becomes a required check that exclusion needs its own answer — a
  # skipped required check passes branch protection, so fork PRs would bypass the suite.
  e2e:
    if: ${{ vars.CORE_IMAGE != '' && (github.repository_owner == 'mattermost' || github.event_name != 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CORE_IMAGE: ${{ vars.CORE_IMAGE }}
      # Lifted to env because the secrets context is not available in a step-level `if`, and the
      # login below has to be skippable: the repository defines no Docker Hub credentials today.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pin is checked, not just documented: a floating tag (:master, :latest) would silently
      # re-point this suite at whatever core published most recently, so an unrelated upstream
      # change would surface here as a test failure with no corresponding commit in this repo.
      - name: ci/verify-core-image-pin
        run: |
          if [[ ! "$CORE_IMAGE" =~ :[0-9a-f]{7,40}$ ]]; then
            echo "CORE_IMAGE must be pinned to a commit sha; got '$CORE_IMAGE'." >&2
            echo "Core CI publishes one image per commit as <repo>:<7-char-sha>." >&2
            exit 1
          fi
          image_tag="${CORE_IMAGE##*:}"

          # The shape check above cannot catch the drift that matters. build/core-commit.txt records
          # the core commit this suite is meant to run against; CORE_IMAGE is a separate repository
          # variable a human sets. Nothing ties them together, so bumping one without the other
          # leaves this suite green against a core image that predates the very changes under test.
          #
          # The comparison is against that file rather than the go.mod server/public pin, because
          # most of the RBAC implementation lives outside the public module: a core commit can change
          # the scheme guards and role composition this suite asserts on without moving the pin.
          pinned_commit="$(grep -vE '^\s*(#|$)' build/core-commit.txt | head -1 | tr -d '[:space:]')"
          if [[ ! "$pinned_commit" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "build/core-commit.txt must hold one core commit sha; got '${pinned_commit}'." >&2
            exit 1
          fi
          # Core CI tags images with a 7-char sha while the pin carries the full 40, so compare on
          # the shorter.
          prefix_len=${#image_tag}
          if (( ${#pinned_commit} < prefix_len )); then
            prefix_len=${#pinned_commit}
          fi
          if [[ "${image_tag:0:$prefix_len}" != "${pinned_commit:0:$prefix_len}" ]]; then
            echo "CORE_IMAGE sha '${image_tag}' does not match the core commit build/core-commit.txt pins (${pinned_commit})." >&2
            echo "Set CORE_IMAGE to the image core CI published for ${pinned_commit}, or bump the pin." >&2
            exit 1
          fi
          echo "CORE_IMAGE ${image_tag} matches the core pin ${pinned_commit}."

      - name: ci/setup
        uses: mattermost/actions/plugin-ci/setup@0256d363493a1e6b9e361ea788c62a0a73bc00be
        with:
          go-version-file: go.mod

      # Reuses the bundle the build job already produced rather than rebuilding it here; the
      # suite globs dist/ for it.
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      # Authenticated so the core image pull is billed to the org's Docker Hub quota rather than the
      # shared anonymous per-IP limit, which GitHub-hosted runners exhaust as a pull failure that
      # reads like a test failure. Skipped when no credentials are configured: the pull still works
      # anonymously, just against the lower limit, so a missing secret must not fail the suite.
      # Both halves of the credential are required: a username with no token would make the
      # login action itself fail, which is exactly the suite-killing outcome being avoided.
      - name: ci/docker-login
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The scheme-backed scenarios drive core's CreateScheme, which is gated on the
      # CustomPermissionsSchemes feature, so the suite boots the server with an Enterprise license.
      # The secret is defined once at the organization and granted to selected repositories; the
      # name matches the one the server and the other plugin repos already use.
      - name: ci/e2e
        run: |
          if [[ -z "$MM_LICENSE" ]]; then
            echo "MM_E2E_TEST_LICENSE_ONPREM_ENT is not available to this repository." >&2
            echo "The scheme-backed scenarios require an Enterprise license; grant the org secret to this repo." >&2
            exit 1
          fi
          go test -tags e2e -count=1 -v ./server/e2e/...
        env:
          MM_LICENSE: ${{ secrets.MM_E2E_TEST_LICENSE_ONPREM_ENT }}

      # On an ordinary test failure the suite prints the container log itself (TestMain), because
      # it tears the container down before the process exits and no later step could read it. This
      # fallback covers only the paths that skip that teardown — a test-binary panic or crash —
      # where the container is still running.
      - name: ci/e2e-logs
        if: failure()
        run: docker ps -aq | xargs -r -I{} sh -c 'echo "===== {} ====="; docker logs {} 2>&1 | tail -400'

  delivery:
    if: ${{ github.repository_owner == 'mattermost' && github.event_name != 'schedule' && github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-ci.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/ci/ --acl public-read --cache-control no-cache
        working-directory: dist

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'mattermost' }}
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ci/download-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: ci/prepare-artifact
        env:
          REF_NAME: ${{ github.ref_name }}
        run: mv *.tar.gz ${GITHUB_REPOSITORY#*/}-${REF_NAME}.tar.gz
        working-directory: dist

      - name: ci/aws-configure
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_RELEASE }}:role/mattermost-release-plugin-store-role

      - name: ci/artifact-upload
        shell: bash
        run: |
          aws s3 cp *.tar.gz s3://mattermost-plugins-delivery/release/ --acl public-read --cache-control no-cache
        working-directory: dist
