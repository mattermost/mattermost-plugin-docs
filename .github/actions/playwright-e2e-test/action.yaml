name: "playwright-e2e-test"
description: Runs the Playwright E2E suite against a throwaway Mattermost container

inputs:
  ARTIFACT_SUFFIX:
    description: Optional suffix for artifact names to avoid conflicts
    required: false
    default: ""
  MM_LICENSE:
    description: >-
      Enterprise license the container is started with, for the callers whose specs need one. Taken
      as an input rather than inherited from the job's env so it is set only on the step that runs
      the suite — `npm ci` above executes third-party install scripts and must not have access to
      it.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: ci/setup-node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
        cache-dependency-path: e2e-tests/playwright/package-lock.json

    - name: ci/install-deps
      shell: bash
      working-directory: e2e-tests/playwright
      run: npm ci

    # Nothing else checks this tree.
    - name: ci/check
      shell: bash
      working-directory: e2e-tests/playwright
      run: |
        npm run check
        npm run check-types

    # Keyed on the Playwright version, so an unrelated bump keeps the browser cache.
    - name: ci/resolve-playwright-version
      id: playwright-version
      shell: bash
      working-directory: e2e-tests/playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: ci/cache-playwright-browsers
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

    # Unconditional: a no-op when cached, and it self-heals a partial cache. The apt
    # libraries live outside the cache and are needed either way.
    - name: ci/install-playwright-browsers
      shell: bash
      working-directory: e2e-tests/playwright
      run: npx playwright install --with-deps chromium

    # Reuse the build job's bundle; rebuilding would need a Go and webapp toolchain.
    - name: ci/download-plugin-bundle
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: dist
        path: dist

    - name: ci/run-playwright-tests
      shell: bash
      working-directory: e2e-tests/playwright
      env:
        TERM: xterm
        MM_LICENSE: ${{ inputs.MM_LICENSE }}
      run: npm test

    - name: ci/upload-playwright-test-results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: playwright-test-results${{ inputs.ARTIFACT_SUFFIX }}
        path: |
          e2e-tests/playwright/results/junit
          e2e-tests/playwright/test-results
        if-no-files-found: warn
        retention-days: 14

    # DEBUG level, carrying session tokens, so only published for a failed run.
    - name: ci/upload-server-logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: playwright-server-logs${{ inputs.ARTIFACT_SUFFIX }}
        path: e2e-tests/playwright/logs
        if-no-files-found: warn
        retention-days: 14
