name: "playwright-e2e-test"
description: Runs the Playwright E2E suite against a throwaway Mattermost container

inputs:
  ARTIFACT_SUFFIX:
    description: Optional suffix for artifact names to avoid conflicts
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: ci/setup-node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
        cache-dependency-path: e2e-tests/playwright/package-lock.json

    - name: ci/install-deps
      shell: bash
      working-directory: e2e-tests/playwright
      run: npm ci

    # Nothing else lints or type-checks this tree, so without this step errors here
    # reach master unnoticed.
    - name: ci/check
      shell: bash
      working-directory: e2e-tests/playwright
      run: |
        npm run check
        npm run check-types

    # Keyed on the installed Playwright version rather than the lockfile hash, so an
    # unrelated dependency bump does not throw away the browser download.
    - name: ci/resolve-playwright-version
      id: playwright-version
      shell: bash
      working-directory: e2e-tests/playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: ci/cache-playwright-browsers
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}

    # Run unconditionally rather than only on a cache miss: it re-downloads nothing when
    # the binaries are already present, and a cache entry that restored but is missing a
    # binary then self-heals instead of failing with "Executable doesn't exist". The apt
    # libraries the browser links against live outside the cache and are needed either way.
    - name: ci/install-playwright-browsers
      shell: bash
      working-directory: e2e-tests/playwright
      run: npx playwright install --with-deps chromium

    # The build job already produced the bundle; rebuilding here would need a Go and
    # webapp toolchain this action deliberately does without.
    - name: ci/download-plugin-bundle
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: dist
        path: dist

    - name: ci/run-playwright-tests
      shell: bash
      working-directory: e2e-tests/playwright
      env:
        TERM: xterm
      run: npm test

    # always(), so a failing run still publishes the junit report, traces, screenshots
    # and any videos — the whole point of having them.
    - name: ci/upload-playwright-test-results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: playwright-test-results${{ inputs.ARTIFACT_SUFFIX }}
        path: |
          e2e-tests/playwright/results/junit
          e2e-tests/playwright/test-results
        if-no-files-found: warn
        retention-days: 14

    # Server logs are DEBUG level and carry session tokens and user emails. Harmless
    # for a throwaway container, but only worth publishing when a run actually failed.
    - name: ci/upload-server-logs
      if: failure()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: playwright-server-logs${{ inputs.ARTIFACT_SUFFIX }}
        path: e2e-tests/playwright/logs
        if-no-files-found: warn
        retention-days: 14
