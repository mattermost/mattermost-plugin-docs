version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - modernize
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unqueryvet
    - unused
    - whitespace
  settings:
    forbidigo:
      # Tests must never pass by skipping. Ban every skip mechanism so the no-skip
      # rule cannot be reintroduced per-test; a missing test DB must fail, not skip.
      forbid:
        - pattern: '\.Skip(f|Now)?$'
          msg: 'tests must never skip; provide a Postgres DSN (TEST_DATABASE_POSTGRESQL_DSN) so the test runs'
        - pattern: '^testing\.Short$'
          msg: 'do not gate tests on -short; tests must always run'
      analyze-types: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
    unqueryvet:
      check-sql-builders: true
  exclusions:
    paths:
      - webapp

      # Node dependencies here vendor Go sources of their own (e.g. flatted),
      # which are not this plugin's code to lint.
      - e2e-tests
    rules:
      - path: server/configuration.go
        linters:
          - unused
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/mattermost/mattermost-plugin-docs
